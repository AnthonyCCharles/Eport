<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 612 398" width="612" height="398">
  <!-- AC Monogram - Centered horizontally to match original position -->
  
  <!-- Letter A - positioned to appear centered when scaled -->
  <path d="M 200 300 L 250 120 L 300 300 M 215 245 L 285 245" 
        stroke="#ffffff" 
        stroke-width="20" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none"/>
  
  <!-- Letter C - positioned next to A -->
  <path d="M 350 210 
           C 350 150, 400 100, 460 100 
           C 500 100, 535 125, 550 160" 
        stroke="#ffffff" 
        stroke-width="20" 
        stroke-linecap="round" 
        fill="none"/>
  <path d="M 350 210 
           C 350 270, 400 320, 460 320 
           C 500 320, 535 295, 550 260" 
        stroke="#ffffff" 
        stroke-width="20" 
        stroke-linecap="round" 
        fill="none"/>
</svg>